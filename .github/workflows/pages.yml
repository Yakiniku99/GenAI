# Publishes a live-updating copy of the dashboard to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish dashboard

on:
  push:
    branches: [main, claude/focused-ritchie-blxf3n]
  schedule:
    - cron: "*/30 * * * *"   # rescan Kalshi every 30 minutes (runs on the default branch)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Scan Kalshi and build static site
        run: python -m kalshi_arb build --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
